[client]
	#Show the date and time a trophy was earned on its tooltip and on hover.
	showEarnedAt = true
	#Display the author of trophy models on their tooltips.
	tooltipCredits = false

	[client.perf]
		#Don't show the items on top of trophies placed in the world.
		skipBlockItems = false
		#Don't show the items on top of trophies in inventories and GUIs.
		skipItemItems = false
		#Don't show trophy bases in inventories and GUIs.
		skipItemBases = false
		#Emergency killswitch for trophies repeating their displayed item's tooltip.
		noTooltip = false

		[client.perf.effects]
			#Don't emit the particle half of trophy effects (aura, orbit, beam sparkles).
			skipEffectParticles = false
			#Don't draw the geometry half of trophy effects (halo, beam shaft, light pool).
			skipGeometryFx = false
			#Trophies further away than this many blocks stop emitting particles.
			# Default: 32
			# Range: 4 ~ 128
			effectRange = 32
